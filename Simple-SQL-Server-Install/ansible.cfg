[defaults]
# inventory file
inventory = hosts.ini

# Disable host key checking for automation (optional, but speeds up first connections)
host_key_checking = False

# Use a persistent fact cache to avoid re-gathering facts unnecessarily
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400

# Reduce the number of forks to match your system's CPU cores
forks = 20

# Enable pipelining globally (can also be set in [ssh_connection])
pipelining = True

# Disable retry files to avoid clutter
retry_files_enabled = False

# Use YAML callback for cleaner output
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True

# Speed up by disabling cowsay if installed
nocows = 1

# Set default timeout for SSH connections
timeout = 30

[ssh_connection]
# Enable SSH pipelining for performance
pipelining = True

# Use SSH multiplexing to reuse connections
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ControlPath=/tmp/ansible-ssh-%h-%p-%r

# Reduce SSH connection setup time
control_path_dir = /tmp/ansible-ssh

# Disable scp if sftp is faster in your environment (or vice versa)
scp_if_ssh = True
